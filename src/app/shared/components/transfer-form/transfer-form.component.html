<form [formGroup]="transferForm" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="outline">
    <mat-label>From Account</mat-label>
    <mat-select formControlName="fromAccount">
      <mat-option *ngFor="let acct of accounts" [value]="acct.id">
        {{ acct.name }} ({{ acct.balance | currency }})
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>To Account</mat-label>
    <input matInput formControlName="toAccount" placeholder="Account number">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Amount</mat-label>
    <input matInput type="number" formControlName="amount" placeholder="0.00">
    <span matPrefix>$&nbsp;</span>
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="transferForm.invalid">
    Submit Transfer
  </button>
</form>
