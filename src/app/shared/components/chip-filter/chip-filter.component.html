<mat-chip-listbox aria-label="Filter selection">
  <mat-chip-option
    *ngFor="let filter of filters"
    [selected]="filter.active"
    (selectionChange)="toggleFilter(filter)"
    (removed)="removeFilter(filter)">
    {{ filter.label }}
    <mat-icon matChipRemove *ngIf="filter.active">cancel</mat-icon>
  </mat-chip-option>
</mat-chip-listbox>
