@if (visibleAlerts.length > 0) {
  <div class="alert-container">
    @for (alert of visibleAlerts; track alert.id) {
      <div
        class="alert-item"
        [class]="'alert-' + alert.type.toLowerCase()"
      >
        <mat-icon class="alert-icon">{{ getAlertIcon(alert.type) }}</mat-icon>
        <div class="alert-content">
          <span class="alert-title">{{ alert.title }}</span>
          <span class="alert-message">{{ alert.message }}</span>
        </div>
        <div class="alert-actions">
          @if (alert.actionUrl) {
            <button
              mat-button
              [color]="getAlertColor(alert.type)"
              (click)="onAction(alert)"
            >
              View
            </button>
          }
          <button mat-icon-button (click)="onDismiss(alert)">
            <mat-icon>close</mat-icon>
          </button>
        </div>
      </div>
    }

    @if (unreadCount > maxVisible) {
      <div class="more-alerts">
        <span class="more-badge">
          +{{ unreadCount - maxVisible }} more alerts
        </span>
      </div>
    }
  </div>
}
