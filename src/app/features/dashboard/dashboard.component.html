<div class="dashboard-content">
  <div class="dashboard-body">
    <!-- Alerts -->
    <app-alert-banner
      [alerts]="alerts"
      (dismiss)="onAlertDismiss($event)">
    </app-alert-banner>

    <!-- Balance Overview -->
    <app-balance-widget
      [accounts]="accounts"
      [showBreakdown]="true">
    </app-balance-widget>

    <!-- Accounts Grid -->
    <div class="section">
      <h2 class="section-title">Your Accounts</h2>
      <div class="accounts-grid">
        @for (account of accounts; track account.id) {
          <app-account-card
            [account]="account"
            (viewDetails)="onAccountViewDetails($event)"
            (quickTransfer)="onAccountQuickTransfer($event)">
          </app-account-card>
        }
      </div>
    </div>

    <!-- Recent Transactions -->
    <div class="section">
      <h2 class="section-title">Recent Transactions</h2>
      <app-chip-filter
        [filters]="transactionFilters"
        (filterChange)="onFilterChange($event)">
      </app-chip-filter>
      <app-transaction-list
        [transactions]="filteredTransactions"
        (transactionSelected)="onTransactionSelected($event)">
      </app-transaction-list>
    </div>
  </div>
</div>
